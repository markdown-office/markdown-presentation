# Office's own palette, with the type scale and the rhythm a screen in a lit room wants:
# roomy margins, an open leading and a rule heavy enough to divide a slide you read from the
# back of a room. A deck that names no theme gets this, and so does every theme that leaves an
# accent alone.
name: Default
description: Office's colours and type, for a deck that says nothing about its look.
author: markdown-office
colors:
  dk1: "#000000"
  lt1: "#FFFFFF"
  dk2: "#44546A"
  lt2: "#E7E6E6"
  accent1: "#4472C4"
  accent2: "#ED7D31"
  accent3: "#A5A5A5"
  accent4: "#FFC000"
  accent5: "#5B9BD5"
  accent6: "#70AD47"
  hlink: "#0563C1"
  folHlink: "#954F72"
fonts:
  heading: Calibri
  body: Calibri
  mono: Consolas
style:
  margin: 40
  gutter: 20
  block: 12
  rule: 2
  body: 16
  title: 28
  cover: 40
  section: 44
  headings: [22, 20, 18, 16, 14]
  leading: 1.2
  heading-weight: bold
  heading-ink: ink
