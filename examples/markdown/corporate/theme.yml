# The design of a corporate deck.
#
# A theme is the design: the colours, the faces, the type scale and the rhythm.
# Everything the deck draws that is not a picture comes from here.
#
# The colours are the twelve slots the format has. `lt1` and `dk1` are the page and
# the ink on a light theme; `lt2` is the quiet ink a caption is written in, and
# `dk2` is the panel a dark slide is painted with.
name: Halden Instruments
description: A light corporate deck with a deep blue primary and a muted gold accent.
author: Halden Instruments
dark: false
colors:
  lt1: "#FFFFFF"
  dk1: "#15243B"
  lt2: "#5A6B80"
  dk2: "#0E1A2B"
  accent1: "#1F5FA8"
  accent2: "#3E8E7E"
  accent3: "#C8A15A"
  accent4: "#B4472F"
  accent5: "#E8EEF6"
  accent6: "#DDE4EC"
  hlink: "#1F5FA8"
  folHlink: "#7A8CA3"
fonts:
  heading: Georgia
  body: Arial
  mono: Consolas
style:
  margin: 60
  gutter: 24
  block: 16
  rule: 2
  body: 16
  title: 34
  cover: 52
  section: 44
  headings: [26, 22, 19, 17, 15]
  leading: 1.4
  heading-weight: bold
  heading-ink: ink

# The layout name of each role.
#
# A `layouts:` section is the whole mapping: a role it does not name is a role the theme
# does not map, and a deck that asks for one is told which roles the theme does map. This
# one names every role.
#
# The names are Office's own, and they are the names a `template.pptx` dropped in beside
# this file would carry. Until that file is there the names are labels: the boxes behind
# them are the ones this theme computes from its own margins and type scale.
layouts:
  title: Title Slide
  content: Title and Content
  two-column: Two Content
  section: Section Header
  blank: Blank
  image-text: Picture Left
  image-title: Picture with Caption
  image-slide: Full Bleed Picture

# The named text styles: the words inside a box, written in a deck as `:brand[...]`.
#
# The properties are the same eight the inline style attributes have, and a size is
# in points as it is everywhere else.
#
# These are the four a corporate deck uses most. The wordmark is the company's own
# name, the brand is the primary colour, the eyebrow is the small line above a
# title, and the muted style is what a caption is written in.
textStyles:
  wordmark:
    color: dk1
    bold: true
  brand:
    color: accent1
    bold: true
  eyebrow:
    color: accent1
    bold: true
    size: 11
  muted:
    color: lt2
    size: 12
